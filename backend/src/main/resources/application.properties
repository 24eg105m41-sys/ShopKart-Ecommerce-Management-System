spring.application.name=ecommerce-management
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_management}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://shopkart-frontend-6lpfdehl7-ecommerce-f8fb.vercel.app}
app.cors.allow-localhost=${APP_CORS_ALLOW_LOCALHOST:false}
app.data.seed-demo-data=${APP_SEED_DEMO_DATA:false}

spring.jackson.time-zone=Asia/Kolkata
