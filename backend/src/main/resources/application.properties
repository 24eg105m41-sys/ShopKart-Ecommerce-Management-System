
spring.application.name=ecommerce-management

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ShopKart Backend Port
server.port=8081

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-to-a-long-secret-key-2026}
jwt.expirationMs=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# Time Zone
spring.jackson.time-zone=Asia/Kolkata
